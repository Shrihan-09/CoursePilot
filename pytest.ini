# Root-level pytest configuration: lets a bare `pytest` from the repository
# root collect BOTH suites in one run.
#
# It is used only when pytest is started from this directory with no path, or
# with a path that has no closer config. `pytest backend/tests` and
# `pytest ingestion/tests` still find backend/pyproject.toml and
# ingestion/pyproject.toml first, so the per-suite runs are unchanged.
#
# Why the import settings are needed: backend/ and ingestion/ are both
# editable installs, so both are on sys.path, and both contain a package named
# `tests`. By default pytest names each conftest by walking up __init__.py
# files, which gives `tests.conftest` for BOTH, and the second one fails with
# ImportPathMismatchError. With importlib mode and namespace-package
# resolution, the suite that does not own the top-level name `tests` is
# imported under its path-qualified name (e.g. `ingestion.tests.conftest`),
# which requires the repository root on sys.path. Sibling helper imports
# inside each suite are relative, so they work under either name.
[pytest]
testpaths =
    backend/tests
    ingestion/tests
addopts = --import-mode=importlib
consider_namespace_packages = true
pythonpath = .

# Mirrors backend/pyproject.toml; the ingestion suite has no async tests.
asyncio_mode = auto

# Both suites mark database-backed tests `db` and register it in their own
# pyproject.toml. Registered here too, because those files are not read when
# pytest starts from the root - which is what produced
# PytestUnknownMarkWarning.
markers =
    db: requires a PostgreSQL database (backend: DATABASE_URL_SYNC; ingestion: TEST_DATABASE_URL)

# Same policy as both suites: warnings are errors, except the cache warning
# caused by OneDrive blocking the atomic rename of .pytest_cache.
filterwarnings =
    error
    ignore::pytest.PytestCacheWarning
