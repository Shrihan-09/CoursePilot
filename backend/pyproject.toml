[project]
name = "coursepilot-backend"
version = "0.1.0"
description = "CoursePilot backend: FastAPI application, deterministic academic core."
readme = "README.md"
# 3.12 is the floor. Note: several pinned deps below do not yet publish
# wheels for 3.14, which is what is installed on the primary dev machine.
# The Docker image pins 3.12 so the containerized path always works.
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Warnings are errors: an unnoticed DeprecationWarning today is a broken
    # build on the next dependency bump.
    "error",
    # Exception: the repo lives under OneDrive, which blocks the atomic
    # directory rename pytest uses to write .pytest_cache. That warning is
    # about the filesystem, not about our code.
    "ignore::pytest.PytestCacheWarning",
]
