[project]
name = "coursepilot-ingestion"
version = "0.1.0"
description = "Rutgers data ingestion pipeline for CoursePilot."
requires-python = ">=3.12"

# Note: this package imports the ORM models from `coursepilot-backend`
# (app.models). That is a known coupling, tracked in docs/ARCHITECTURE.md:
# the shared models should eventually move into their own package that both
# the backend and ingestion depend on. Install the backend editable alongside:
#     pip install -e ./backend -e ./ingestion
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Playwright/BeautifulSoup are deliberately absent. The SOC source is JSON, so
# no browser engine or HTML parser is needed. They go in when a source that
# actually requires them is implemented (e.g. the course catalog).
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coursepilot_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::pytest.PytestCacheWarning",
]
markers = [
    "db: requires a live database connection",
]
